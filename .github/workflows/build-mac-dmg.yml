name: Build macOS DMG (artifact)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            artifact: GBP-Rank-Tracker-macOS-Intel
          - runner: macos-latest
            arch: arm64
            artifact: GBP-Rank-Tracker-macOS-Apple-Silicon

    runs-on: ${{ matrix.runner }}

    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      DATABASE_URL: 'file:./prisma/dev.db'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Python setuptools (macOS)
        run: pip3 install setuptools --break-system-packages || pip3 install setuptools || true

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create database for build
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Build Next.js
        run: npx next build

      - name: Verify standalone output exists
        run: |
          node -e "const fs=require('fs'); if(!fs.existsSync('.next/standalone/server.js')){console.error('ERROR: standalone server.js missing - Next.js build did not produce standalone output');process.exit(1);} console.log('Standalone output verified.');"

      - name: Copy static assets
        run: node scripts/copy-static.js

      - name: Compile Electron TypeScript
        run: npm run electron:compile

      - name: Rebuild better-sqlite3 for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Create empty data/postal directory
        run: node -e "require('fs').mkdirSync('data/postal',{recursive:true})"

      - name: Download Playwright Chromium for bundling
        run: node scripts/bundle-playwright.js

      - name: Build Electron DMG
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Rename DMG by architecture
        run: |
          DMG=$(find dist-electron -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$DMG"
          cp "$DMG" "dist-electron/GBP-Rank-Tracker-1.9.8-${{ matrix.arch }}.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-electron/GBP-Rank-Tracker-1.9.8-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14
